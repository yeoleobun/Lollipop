name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0)"
        required: false
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  release-macos-arm64:
    name: Build & Release (macOS arm64)
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Apple Silicon & Swift toolchain
        run: |
          uname -m
          sw_vers
          swift --version

      - name: Import Code Signing Certificate
        env:
          CODESIGN_P12: ${{ secrets.CODESIGN_P12 }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          if [ -z "$CODESIGN_P12" ] || [ -z "$CODESIGN_PASSWORD" ]; then
            echo "Error: CODESIGN_P12 and CODESIGN_PASSWORD secrets must be set." >&2
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/lollipop-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          P12_PATH="$RUNNER_TEMP/cert.p12"

          echo "$CODESIGN_P12" | base64 --decode > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$CODESIGN_PASSWORD" -A -t cert -f pkcs12 -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          rm -f "$P12_PATH"

      - name: Build Lollipop.app, ZIP, and DMG (arm64)
        env:
          SIGN_IDENTITY: yeoleobun
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          VERSION="${TAG_NAME#v}" PACKAGE_DMG=1 ./scripts/bundle_app.sh
          codesign -dv --verbose=2 build/Lollipop.app
          cat build/SHA256SUMS.txt

      - name: Cleanup Temporary Keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/lollipop-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ### Install (Apple Silicon)

            **Homebrew (Recommended):**
            ```bash
            brew tap yeoleobun/tap
            brew install --cask yeoleobun/tap/lollipop
            ```

            **Upgrade:**
            ```bash
            brew upgrade --cask lollipop
            ```
          files: |
            build/Lollipop-*-macOS-arm64.dmg
            build/Lollipop-*-macOS-arm64.zip
            build/SHA256SUMS.txt

      - name: Auto-bump yeoleobun/homebrew-tap (when HOMEBREW_TAP_TOKEN secret is set)
        if: github.ref_type == 'tag'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping automatic homebrew-tap push."
            exit 0
          fi
          VERSION="${TAG_NAME#v}"
          ZIP_SHA=$(awk '/Lollipop-.*-macOS-arm64\.zip/ {print $1}' build/SHA256SUMS.txt)
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          rm -rf "$TAP_DIR"
          git -c credential.helper= clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/yeoleobun/homebrew-tap.git" "$TAP_DIR"
          cd "$TAP_DIR"
          sed -i '' -e "s/version \".*\"/version \"${VERSION}\"/" -e "s/sha256 \".*\"/sha256 \"${ZIP_SHA}\"/" Casks/lollipop.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/lollipop.rb
          if ! git diff --cached --quiet; then
            git commit -m "Bump lollipop cask to ${VERSION}"
            if ! git -c credential.helper= push origin main; then
              echo "::error::Failed to push to yeoleobun/homebrew-tap. Ensure the HOMEBREW_TAP_TOKEN secret has write access to yeoleobun/homebrew-tap ('Contents: Read and write' for a fine-grained PAT, or 'public_repo'/'repo' scope for a classic PAT)."
              exit 1
            fi
          fi
